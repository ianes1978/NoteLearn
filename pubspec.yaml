name: notelearn
description: "App per imparare il nome delle note sul pentagramma (chiave di violino e di basso), con notazione Do-Re-Mi e A-B-C."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^6.1.0
  shared_preferences: ^2.2.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Fissa il plugin del ciclo di vita Android a una versione che non richiede
# compileSdk 36 (le versioni recenti, tirate da file_picker, lo pretendono e
# fanno fallire la build APK con il Flutter di questa CI).
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

flutter:
  uses-material-design: true
